<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    text { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: bold; }
    .section { font-size: 18px; font-weight: bold; fill: #1e3a8a; }
    .entity { fill: #e8f0fe; stroke: #1e3a8a; stroke-width: 2; }
    .entity-name { font-size: 17px; font-weight: bold; text-anchor: middle; }
    .rel { fill: #fff7e6; stroke: #b45309; stroke-width: 2; }
    .rel-name { font-size: 15px; text-anchor: middle; }
    .line { stroke: #1f2937; stroke-width: 1.8; fill: none; }
    .role { font-size: 14px; font-style: italic; fill: #374151; }
    .card { font-size: 15px; font-weight: bold; fill: #c2410c; }
    .attr { font-size: 14px; text-anchor: middle; }
    .attr-dot { stroke: #1f2937; stroke-width: 1.6; }
    .small { font-size: 13px; fill: #374151; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    .box-title { font-size: 15px; font-weight: bold; }
    .rule { font-size: 13.5px; }
    .rule-card { font-size: 13.5px; font-weight: bold; fill: #c2410c; }
    .tbl-head { fill: #1e3a8a; }
    .tbl-head-text { font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .tbl-row { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
    .tbl-row-alt { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
    .tbl-border { fill: none; stroke: #1e3a8a; stroke-width: 2; }
    .col { font-size: 13px; }
    .pk { font-size: 12px; font-weight: bold; fill: #a16207; text-anchor: middle; }
    .fk { font-size: 12px; font-weight: bold; fill: #1d4ed8; text-anchor: middle; }
    .type { font-size: 12.5px; fill: #4b5563; }
    .constr { font-size: 12px; fill: #6b7280; }
    .crow { stroke: #1f2937; stroke-width: 1.8; fill: none; }
    .rel-label { font-size: 14px; font-style: italic; fill: #b45309; }
    .arrow { font-family: "DejaVu Sans", sans-serif; }
    .mult { font-size: 12.5px; font-weight: bold; fill: #c2410c; }
  </style>

  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="45" class="title">Modelagem de Banco de Dados — Funcionário, Supervisor e Área</text>
  <line x1="40" y1="62" x2="1360" y2="62" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ============ 1. MODELO CONCEITUAL ============ -->
  <text x="40" y="100" class="section">1. Modelo Conceitual — Diagrama Entidade-Relacionamento (notação de Peter Chen)</text>

  <!-- Autorrelacionamento: supervisiona -->
  <line x1="270" y1="190" x2="270" y2="290" class="line"/>
  <line x1="430" y1="190" x2="430" y2="290" class="line"/>
  <polygon points="350,155 430,190 350,225 270,190" class="rel"/>
  <text x="350" y="195" class="rel-name">supervisiona</text>

  <text x="262" y="232" class="role" text-anchor="end">supervisor</text>
  <text x="262" y="280" class="card" text-anchor="end">(1,1)</text>
  <text x="438" y="232" class="role">supervisionado</text>
  <text x="438" y="280" class="card">(1,N)</text>

  <!-- Entidade FUNCIONÁRIO -->
  <rect x="230" y="290" width="240" height="60" class="entity"/>
  <text x="350" y="326" class="entity-name">FUNCIONÁRIO</text>

  <!-- Atributos de FUNCIONÁRIO -->
  <line x1="270" y1="350" x2="270" y2="388" class="line"/>
  <circle cx="270" cy="394" r="6" fill="#1f2937" class="attr-dot"/>
  <text x="270" y="420" class="attr">matrícula</text>
  <line x1="350" y1="350" x2="350" y2="388" class="line"/>
  <circle cx="350" cy="394" r="6" fill="#ffffff" class="attr-dot"/>
  <text x="350" y="420" class="attr">nome</text>
  <line x1="430" y1="350" x2="430" y2="388" class="line"/>
  <circle cx="430" cy="394" r="6" fill="#ffffff" class="attr-dot"/>
  <text x="430" y="420" class="attr">cpf</text>

  <!-- Relacionamento: trabalha em -->
  <line x1="470" y1="320" x2="570" y2="320" class="line"/>
  <line x1="740" y1="320" x2="840" y2="320" class="line"/>
  <polygon points="655,285 740,320 655,355 570,320" class="rel"/>
  <text x="655" y="325" class="rel-name">trabalha em</text>
  <text x="478" y="343" class="card">(1,N)</text>
  <text x="832" y="343" class="card" text-anchor="end">(1,1)</text>

  <!-- Entidade ÁREA -->
  <rect x="840" y="290" width="200" height="60" class="entity"/>
  <text x="940" y="326" class="entity-name">ÁREA</text>

  <!-- Atributos de ÁREA -->
  <line x1="900" y1="350" x2="900" y2="388" class="line"/>
  <circle cx="900" cy="394" r="6" fill="#1f2937" class="attr-dot"/>
  <text x="900" y="420" class="attr">código</text>
  <line x1="980" y1="350" x2="980" y2="388" class="line"/>
  <circle cx="980" cy="394" r="6" fill="#ffffff" class="attr-dot"/>
  <text x="980" y="420" class="attr">nome</text>

  <!-- Legenda do conceitual -->
  <circle cx="236" cy="456" r="5" fill="#1f2937" class="attr-dot"/>
  <text x="248" y="461" class="small">atributo identificador</text>
  <circle cx="410" cy="456" r="5" fill="#ffffff" class="attr-dot"/>
  <text x="422" y="461" class="small">atributo</text>
  <text x="520" y="461" class="small">O supervisor também é um FUNCIONÁRIO <tspan class="arrow">→</tspan> autorrelacionamento (relacionamento recursivo).</text>

  <!-- Regras de negócio -->
  <rect x="1080" y="120" width="290" height="300" rx="8" class="box"/>
  <text x="1096" y="148" class="box-title">Regras de negócio <tspan class="arrow">→</tspan> cardinalidade</text>
  <text class="rule">
    <tspan x="1096" y="178">1. Funcionário tem no mínimo 1 e no</tspan>
    <tspan x="1096" dy="18">máximo 1 supervisor</tspan>
  </text>
  <text x="1096" y="214" class="rule-card"><tspan class="arrow">→</tspan> lado supervisor: (1,1)</text>
  <text class="rule">
    <tspan x="1096" y="246">2. Supervisor supervisiona no mínimo</tspan>
    <tspan x="1096" dy="18">1 e no máximo N funcionários</tspan>
  </text>
  <text x="1096" y="282" class="rule-card"><tspan class="arrow">→</tspan> lado supervisionado: (1,N)</text>
  <text class="rule">
    <tspan x="1096" y="314">3. Funcionário trabalha em somente</tspan>
    <tspan x="1096" dy="18">1 área</tspan>
  </text>
  <text x="1096" y="350" class="rule-card"><tspan class="arrow">→</tspan> lado ÁREA: (1,1)</text>
  <text class="rule">
    <tspan x="1096" y="382">4. Área tem muitos funcionários</tspan>
  </text>
  <text x="1096" y="400" class="rule-card"><tspan class="arrow">→</tspan> lado FUNCIONÁRIO: (1,N)</text>

  <!-- ============ 2. MODELO LÓGICO ============ -->
  <line x1="40" y1="500" x2="1360" y2="500" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="540" class="section">2. Modelo Lógico — Relacional (notação pé de galinha)</text>

  <!-- Tabela FUNCIONARIO: colunas 230 | 274 | 400 | 512 | 582 -->
  <rect x="230" y="580" width="352" height="36" class="tbl-head"/>
  <text x="406" y="604" class="tbl-head-text">FUNCIONARIO</text>
  <rect x="230" y="616" width="352" height="30" class="tbl-row"/>
  <rect x="230" y="646" width="352" height="30" class="tbl-row-alt"/>
  <rect x="230" y="676" width="352" height="30" class="tbl-row"/>
  <rect x="230" y="706" width="352" height="30" class="tbl-row-alt"/>
  <rect x="230" y="736" width="352" height="30" class="tbl-row"/>
  <line x1="274" y1="616" x2="274" y2="766" stroke="#cbd5e1"/>
  <rect x="230" y="580" width="352" height="186" class="tbl-border"/>

  <text x="252" y="636" class="pk">PK</text>
  <text x="284" y="636" class="col" font-weight="bold">id_funcionario</text>
  <text x="400" y="636" class="type">INT</text>
  <text x="512" y="636" class="constr">NN</text>

  <text x="284" y="666" class="col">nome</text>
  <text x="400" y="666" class="type">VARCHAR(100)</text>
  <text x="512" y="666" class="constr">NN</text>

  <text x="284" y="696" class="col">cpf</text>
  <text x="400" y="696" class="type">CHAR(11)</text>
  <text x="512" y="696" class="constr">NN, UQ</text>

  <text x="252" y="726" class="fk">FK</text>
  <text x="284" y="726" class="col">id_supervisor</text>
  <text x="400" y="726" class="type">INT</text>
  <text x="512" y="726" class="constr">NN</text>

  <text x="252" y="756" class="fk">FK</text>
  <text x="284" y="756" class="col">id_area</text>
  <text x="400" y="756" class="type">INT</text>
  <text x="512" y="756" class="constr">NN</text>

  <!-- Tabela AREA: colunas 880 | 924 | 1024 | 1136 | 1206 -->
  <rect x="880" y="580" width="326" height="36" class="tbl-head"/>
  <text x="1043" y="604" class="tbl-head-text">AREA</text>
  <rect x="880" y="616" width="326" height="30" class="tbl-row"/>
  <rect x="880" y="646" width="326" height="30" class="tbl-row-alt"/>
  <line x1="924" y1="616" x2="924" y2="676" stroke="#cbd5e1"/>
  <rect x="880" y="580" width="326" height="96" class="tbl-border"/>

  <text x="902" y="636" class="pk">PK</text>
  <text x="934" y="636" class="col" font-weight="bold">id_area</text>
  <text x="1024" y="636" class="type">INT</text>
  <text x="1124" y="636" class="constr">NN</text>

  <text x="934" y="666" class="col">nome</text>
  <text x="1024" y="666" class="type">VARCHAR(50)</text>
  <text x="1124" y="666" class="constr">NN, UQ</text>

  <!-- FUNCIONARIO.id_area <tspan class="arrow">→</tspan> AREA.id_area -->
  <polyline points="582,751 731,751 731,631 880,631" class="line"/>
  <!-- pé de galinha (1..N) no lado FUNCIONARIO -->
  <path d="M600,751 L582,741 M600,751 L582,751 M600,751 L582,761 M606,743 L606,759" class="crow"/>
  <!-- exatamente um (||) no lado AREA -->
  <path d="M864,623 L864,639 M870,623 L870,639" class="crow"/>
  <text x="614" y="743" class="mult">1..N</text>
  <text x="856" y="623" class="mult" text-anchor="end">1</text>
  <text x="741" y="695" class="rel-label">trabalha em</text>

  <!-- Autorrelacionamento: FUNCIONARIO.id_supervisor <tspan class="arrow">→</tspan> FUNCIONARIO.id_funcionario -->
  <polyline points="230,721 110,721 110,631 230,631" class="line"/>
  <!-- exatamente um (||) no lado supervisor (PK) -->
  <path d="M214,623 L214,639 M220,623 L220,639" class="crow"/>
  <!-- pé de galinha (1..N) no lado supervisionado (FK) -->
  <path d="M212,721 L230,711 M212,721 L230,721 M212,721 L230,731 M206,713 L206,729" class="crow"/>
  <text x="160" y="623" class="small" text-anchor="middle">supervisor (1)</text>
  <text x="158" y="746" class="small" text-anchor="middle">supervisionado (1..N)</text>
  <text transform="translate(100,676) rotate(-90)" class="rel-label" text-anchor="middle">supervisiona</text>

  <!-- Legenda do lógico -->
  <line x1="230" y1="812" x2="272" y2="812" class="line"/>
  <path d="M260,804 L260,820 M266,804 L266,820" class="crow"/>
  <text x="282" y="817" class="small">exatamente um (1)</text>

  <line x1="430" y1="812" x2="472" y2="812" class="line"/>
  <path d="M454,812 L472,802 M454,812 L472,812 M454,812 L472,822 M448,804 L448,820" class="crow"/>
  <text x="482" y="817" class="small">um ou muitos (1..N)</text>

  <text x="650" y="817" class="small"><tspan font-weight="bold" fill="#a16207">PK</tspan> chave primária   ·   <tspan font-weight="bold" fill="#1d4ed8">FK</tspan> chave estrangeira   ·   NN NOT NULL   ·   UQ UNIQUE</text>

  <text class="small">
    <tspan x="230" y="852">Obs.: id_supervisor é NOT NULL porque todo funcionário tem exatamente 1 supervisor; o funcionário do topo da hierarquia</tspan>
    <tspan x="230" dy="18">(ex.: diretor) referencia a si mesmo. Um funcionário só é supervisor se aparecer em id_supervisor de pelo menos 1 funcionário.</tspan>
  </text>
</svg>
