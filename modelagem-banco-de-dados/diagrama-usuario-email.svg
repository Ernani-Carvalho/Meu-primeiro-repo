<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3ee"/>
      <stop offset="1" stop-color="#8fb4dd"/>
    </linearGradient>
    <linearGradient id="idx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c9c9"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <!-- chave primária -->
    <g id="pk">
      <ellipse cx="0" cy="-3" rx="3.2" ry="3.6" fill="#f5c400" stroke="#9a7a00" stroke-width="0.8"/>
      <rect x="-1.1" y="0" width="2.2" height="7" fill="#f5c400" stroke="#9a7a00" stroke-width="0.6"/>
    </g>
    <!-- coluna comum (losango vazado) -->
    <polygon id="col" points="0,-5 5,0 0,5 -5,0" fill="#ffffff" stroke="#7fa6c9" stroke-width="1.2"/>
    <!-- chave estrangeira (losango vermelho) -->
    <polygon id="fk" points="0,-5 5,0 0,5 -5,0" fill="#e0574c" stroke="#a8322a" stroke-width="0.8"/>
    <!-- ícone de tabela -->
    <g id="tbl">
      <rect x="0" y="0" width="15" height="13" fill="#ffffff" stroke="#2f5f9a" stroke-width="1.2"/>
      <rect x="0" y="0" width="15" height="3.5" fill="#2f5f9a"/>
      <line x1="0" y1="8" x2="15" y2="8" stroke="#2f5f9a" stroke-width="0.9"/>
      <line x1="7.5" y1="3.5" x2="7.5" y2="13" stroke="#2f5f9a" stroke-width="0.9"/>
    </g>
  </defs>
  <style>
    text { font-family: Tahoma, "DejaVu Sans", Verdana, sans-serif; fill: #1a1a1a; }
    .tname { font-size: 15px; font-weight: bold; }
    .col { font-size: 12px; }
    .idx { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .rel { stroke: #555555; stroke-width: 1.6; fill: none; stroke-dasharray: 9 6; }
    .end { stroke: #555555; stroke-width: 1.4; fill: none; }
  </style>

  <!-- camada (layer) -->
  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>
  <rect x="2" y="2" width="756" height="276" fill="#f2f2fb" stroke="#c8c8dc" stroke-width="1"/>
  <path d="M2,2 H178 L188,26 H2 Z" fill="url(#tab)" stroke="#c0c0c0" stroke-width="1"/>
  <text x="10" y="19" font-size="12">Usuário e Email</text>

  <!-- ===== tabela usuario ===== -->
  <g>
    <rect x="80" y="60" width="230" height="164" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M80,94 V66 a6,6 0 0 1 6,-6 H304 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="90" y="70"/>
    <text x="114" y="83" class="tname">usuario</text>
    <polygon points="290,73 300,73 295,80" fill="#555"/>
    <rect x="81" y="94" width="228" height="90" fill="#ffffff"/>

    <use href="#pk" x="96" y="111"/>
    <text x="108" y="114" class="col">idUsuario INT</text>
    <use href="#col" x="96" y="139"/>
    <text x="108" y="143" class="col">nome VARCHAR(45)</text>
    <use href="#fk" x="96" y="169"/>
    <text x="108" y="173" class="col">fkGerente INT</text>

    <rect x="81" y="184" width="228" height="30" fill="url(#idx)"/>
    <text x="92" y="204" class="idx">Indexes</text>
    <polygon points="292,193 300,199 292,205" fill="#666"/>
  </g>

  <!-- ===== tabela email ===== -->
  <g>
    <rect x="470" y="60" width="230" height="164" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M470,94 V66 a6,6 0 0 1 6,-6 H694 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="480" y="70"/>
    <text x="504" y="83" class="tname">email</text>
    <polygon points="680,73 690,73 685,80" fill="#555"/>
    <rect x="471" y="94" width="228" height="90" fill="#ffffff"/>

    <use href="#pk" x="486" y="111"/>
    <text x="498" y="114" class="col">idEmail INT</text>
    <use href="#col" x="486" y="139"/>
    <text x="498" y="143" class="col">email VARCHAR(45)</text>
    <use href="#fk" x="486" y="169"/>
    <text x="498" y="173" class="col">fkUsuario INT</text>

    <rect x="471" y="184" width="228" height="30" fill="url(#idx)"/>
    <text x="482" y="204" class="idx">Indexes</text>
    <polygon points="682,193 690,199 682,205" fill="#666"/>
  </g>

  <!-- usuario (1) para email (1..N) -->
  <polyline points="310,110 390,110 390,169 470,169" class="rel"/>
  <path d="M318,102 L318,118 M324,102 L324,118" class="end"/>
  <path d="M452,169 L469,160 M452,169 L469,169 M452,169 L469,178 M446,161 L446,177" class="end"/>

  <!-- autorrelacionamento: gerente (1) para gerenciados (0..N) -->
  <polyline points="80,169 40,169 40,110 80,110" class="rel"/>
  <path d="M62,169 L79,160 M62,169 L79,169 M62,169 L79,178" class="end"/>
  <circle cx="55" cy="169" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M64,102 L64,118 M70,102 L70,118" class="end"/>
</svg>
