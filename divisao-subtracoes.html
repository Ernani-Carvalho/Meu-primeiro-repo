<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Divisão por subtrações sucessivas</title>
</head>

<body>
    <h1>Divisão por subtrações sucessivas</h1>

    <label>Dividendo:</label>
    <input type="text" id="ipt_dividendo">
    <br>
    <br>
    <label>Divisor:</label>
    <input type="text" id="ipt_divisor">
    <br>
    <br>
    <button onclick="dividir()">Calcular</button>
    <div id="div_msg"></div>
</body>

</html>


<script>
    function dividir() {
        div_msg.innerHTML = ""
        let dividendo = Number(ipt_dividendo.value);
        let divisor = Number(ipt_divisor.value);

        if (divisor == 0) {
            div_msg.innerHTML = "Erro: não existe divisão por zero.";
        } else {

            let resto = dividendo;
            let quociente = 0;

            while (resto >= divisor) {
                div_msg.innerHTML += `${resto} - ${divisor} = ${resto - divisor}<br>`;
                resto = resto - divisor;
                quociente = quociente + 1;
            }

            div_msg.innerHTML += `<br>${dividendo} ÷ ${divisor} = ${quociente}, resto ${resto}`;
        }
    }
</script>
