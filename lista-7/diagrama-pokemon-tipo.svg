<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3ee"/>
      <stop offset="1" stop-color="#8fb4dd"/>
    </linearGradient>
    <linearGradient id="idx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c9c9"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <!-- chave primária -->
    <g id="pk">
      <ellipse cx="0" cy="-3" rx="3.2" ry="3.6" fill="#f5c400" stroke="#9a7a00" stroke-width="0.8"/>
      <rect x="-1.1" y="0" width="2.2" height="7" fill="#f5c400" stroke="#9a7a00" stroke-width="0.6"/>
    </g>
    <!-- coluna comum (losango vazado) -->
    <polygon id="col" points="0,-5 5,0 0,5 -5,0" fill="#ffffff" stroke="#7fa6c9" stroke-width="1.2"/>
    <!-- coluna NOT NULL (losango azul preenchido) -->
    <polygon id="nn" points="0,-5 5,0 0,5 -5,0" fill="#4a86c8" stroke="#2f5f9a" stroke-width="0.8"/>
    <!-- chave estrangeira (losango vermelho) -->
    <polygon id="fk" points="0,-5 5,0 0,5 -5,0" fill="#e0574c" stroke="#a8322a" stroke-width="0.8"/>
    <!-- ícone de tabela -->
    <g id="tbl">
      <rect x="0" y="0" width="15" height="13" fill="#ffffff" stroke="#2f5f9a" stroke-width="1.2"/>
      <rect x="0" y="0" width="15" height="3.5" fill="#2f5f9a"/>
      <line x1="0" y1="8" x2="15" y2="8" stroke="#2f5f9a" stroke-width="0.9"/>
      <line x1="7.5" y1="3.5" x2="7.5" y2="13" stroke="#2f5f9a" stroke-width="0.9"/>
    </g>
  </defs>
  <style>
    text { font-family: Tahoma, "DejaVu Sans", Verdana, sans-serif; fill: #1a1a1a; }
    .tname { font-size: 15px; font-weight: bold; }
    .col { font-size: 12px; }
    .idx { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .rel { stroke: #555555; stroke-width: 1.6; fill: none; stroke-dasharray: 9 6; }
    .end { stroke: #555555; stroke-width: 1.4; fill: none; }
  </style>

  <!-- camada (layer) -->
  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>
  <rect x="2" y="2" width="756" height="346" fill="#f2f2fb" stroke="#c8c8dc" stroke-width="1"/>
  <path d="M2,2 H218 L228,26 H2 Z" fill="url(#tab)" stroke="#c0c0c0" stroke-width="1"/>
  <text x="10" y="19" font-size="12">Cadeia Evolutiva dos Pokémon</text>

  <!-- ===== tabela pokemon ===== -->
  <g>
    <rect x="90" y="60" width="230" height="254" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M90,94 V66 a6,6 0 0 1 6,-6 H314 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="100" y="70"/>
    <text x="124" y="83" class="tname">pokemon</text>
    <polygon points="300,73 310,73 305,80" fill="#555"/>
    <rect x="91" y="94" width="228" height="180" fill="#ffffff"/>

    <use href="#pk" x="106" y="111"/>
    <text x="118" y="114" class="col">pkPokemon INT</text>
    <use href="#nn" x="106" y="139"/>
    <text x="118" y="143" class="col">nmPokemon VARCHAR(45)</text>
    <use href="#nn" x="106" y="169"/>
    <text x="118" y="173" class="col">nrPokedex INT</text>
    <use href="#fk" x="106" y="199"/>
    <text x="118" y="203" class="col">fkTipo INT</text>
    <use href="#fk" x="106" y="229"/>
    <text x="118" y="233" class="col">fkEvoluiDe INT</text>
    <use href="#col" x="106" y="259"/>
    <text x="118" y="263" class="col">dsAtaqueEspecial VARCHAR(45)</text>

    <rect x="91" y="274" width="228" height="30" fill="url(#idx)"/>
    <text x="102" y="294" class="idx">Indexes</text>
    <polygon points="302,283 310,289 302,295" fill="#666"/>
  </g>

  <!-- ===== tabela tipo ===== -->
  <g>
    <rect x="480" y="60" width="230" height="134" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M480,94 V66 a6,6 0 0 1 6,-6 H704 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="490" y="70"/>
    <text x="514" y="83" class="tname">tipo</text>
    <polygon points="690,73 700,73 695,80" fill="#555"/>
    <rect x="481" y="94" width="228" height="60" fill="#ffffff"/>

    <use href="#pk" x="496" y="111"/>
    <text x="508" y="114" class="col">pkTipo INT</text>
    <use href="#nn" x="496" y="139"/>
    <text x="508" y="143" class="col">nmTipo VARCHAR(45)</text>

    <rect x="481" y="154" width="228" height="30" fill="url(#idx)"/>
    <text x="492" y="174" class="idx">Indexes</text>
    <polygon points="692,163 700,169 692,175" fill="#666"/>
  </g>

  <!-- pokemon (0..N) para tipo (1) -->
  <polyline points="320,199 400,199 400,110 480,110" class="rel"/>
  <path d="M338,199 L321,190 M338,199 L321,199 M338,199 L321,208" class="end"/>
  <circle cx="345" cy="199" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M462,102 L462,118 M468,102 L468,118" class="end"/>

  <!-- autorrelacionamento: evolui de (0..1) para evolui para (0..N) -->
  <polyline points="90,229 34,229 34,110 90,110" class="rel"/>
  <path d="M72,229 L89,220 M72,229 L89,229 M72,229 L89,238" class="end"/>
  <circle cx="65" cy="229" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M76,102 L76,118" class="end"/>
  <circle cx="64" cy="110" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
</svg>
