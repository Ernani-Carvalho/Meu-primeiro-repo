<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3ee"/>
      <stop offset="1" stop-color="#8fb4dd"/>
    </linearGradient>
    <linearGradient id="idx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c9c9"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <!-- chave primária -->
    <g id="pk">
      <ellipse cx="0" cy="-3" rx="3.2" ry="3.6" fill="#f5c400" stroke="#9a7a00" stroke-width="0.8"/>
      <rect x="-1.1" y="0" width="2.2" height="7" fill="#f5c400" stroke="#9a7a00" stroke-width="0.6"/>
    </g>
    <!-- coluna comum (losango vazado) -->
    <polygon id="col" points="0,-5 5,0 0,5 -5,0" fill="#ffffff" stroke="#7fa6c9" stroke-width="1.2"/>
    <!-- coluna NOT NULL (losango azul preenchido) -->
    <polygon id="nn" points="0,-5 5,0 0,5 -5,0" fill="#4a86c8" stroke="#2f5f9a" stroke-width="0.8"/>
    <!-- chave estrangeira (losango vermelho) -->
    <polygon id="fk" points="0,-5 5,0 0,5 -5,0" fill="#e0574c" stroke="#a8322a" stroke-width="0.8"/>
    <!-- ícone de tabela -->
    <g id="tbl">
      <rect x="0" y="0" width="15" height="13" fill="#ffffff" stroke="#2f5f9a" stroke-width="1.2"/>
      <rect x="0" y="0" width="15" height="3.5" fill="#2f5f9a"/>
      <line x1="0" y1="8" x2="15" y2="8" stroke="#2f5f9a" stroke-width="0.9"/>
      <line x1="7.5" y1="3.5" x2="7.5" y2="13" stroke="#2f5f9a" stroke-width="0.9"/>
    </g>
  </defs>
  <style>
    text { font-family: Tahoma, "DejaVu Sans", Verdana, sans-serif; fill: #1a1a1a; }
    .tname { font-size: 15px; font-weight: bold; }
    .col { font-size: 12px; }
    .idx { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .rel { stroke: #555555; stroke-width: 1.6; fill: none; stroke-dasharray: 9 6; }
    .end { stroke: #555555; stroke-width: 1.4; fill: none; }
  </style>

  <!-- camada (layer) -->
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
  <rect x="2" y="2" width="996" height="376" fill="#f2f2fb" stroke="#c8c8dc" stroke-width="1"/>
  <path d="M2,2 H218 L228,26 H2 Z" fill="url(#tab)" stroke="#c0c0c0" stroke-width="1"/>
  <text x="10" y="19" font-size="12">Escola de Tecnologia</text>

  <g>
    <rect x="40" y="60" width="230" height="284" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M40,94 V66 a6,6 0 0 1 6,-6 H264 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="50" y="70"/>
    <text x="74" y="83" class="tname">aluno</text>
    <polygon points="250,73 260,73 255,80" fill="#555"/>
    <rect x="41" y="94" width="228" height="210" fill="#ffffff"/>
    <use href="#pk" x="56" y="110"/>
    <text x="68" y="114" class="col">pkAluno INT</text>
    <use href="#nn" x="56" y="140"/>
    <text x="68" y="144" class="col">ra VARCHAR(10)</text>
    <use href="#nn" x="56" y="170"/>
    <text x="68" y="174" class="col">nmAluno VARCHAR(45)</text>
    <use href="#nn" x="56" y="200"/>
    <text x="68" y="204" class="col">email VARCHAR(100)</text>
    <use href="#nn" x="56" y="230"/>
    <text x="68" y="234" class="col">dtNascimento DATE</text>
    <use href="#fk" x="56" y="260"/>
    <text x="68" y="264" class="col">fkTurma INT</text>
    <use href="#col" x="56" y="290"/>
    <text x="68" y="294" class="col">telefone VARCHAR(15)</text>
    <rect x="41" y="304" width="228" height="30" fill="url(#idx)"/>
    <text x="52" y="324" class="idx">Indexes</text>
    <polygon points="252,313 260,319 252,325" fill="#666"/>
  </g>

  <g>
    <rect x="385" y="60" width="230" height="194" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M385,94 V66 a6,6 0 0 1 6,-6 H609 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="395" y="70"/>
    <text x="419" y="83" class="tname">turma</text>
    <polygon points="595,73 605,73 600,80" fill="#555"/>
    <rect x="386" y="94" width="228" height="120" fill="#ffffff"/>
    <use href="#pk" x="401" y="110"/>
    <text x="413" y="114" class="col">pkTurma INT</text>
    <use href="#nn" x="401" y="140"/>
    <text x="413" y="144" class="col">codigo VARCHAR(10)</text>
    <use href="#nn" x="401" y="170"/>
    <text x="413" y="174" class="col">semestreIngresso CHAR(6)</text>
    <use href="#fk" x="401" y="200"/>
    <text x="413" y="204" class="col">fkCurso INT</text>
    <rect x="386" y="214" width="228" height="30" fill="url(#idx)"/>
    <text x="397" y="234" class="idx">Indexes</text>
    <polygon points="597,223 605,229 597,235" fill="#666"/>
  </g>

  <g>
    <rect x="730" y="60" width="230" height="194" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M730,94 V66 a6,6 0 0 1 6,-6 H954 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="740" y="70"/>
    <text x="764" y="83" class="tname">curso</text>
    <polygon points="940,73 950,73 945,80" fill="#555"/>
    <rect x="731" y="94" width="228" height="120" fill="#ffffff"/>
    <use href="#pk" x="746" y="110"/>
    <text x="758" y="114" class="col">pkCurso INT</text>
    <use href="#nn" x="746" y="140"/>
    <text x="758" y="144" class="col">nmCurso VARCHAR(45)</text>
    <use href="#nn" x="746" y="170"/>
    <text x="758" y="174" class="col">sigla VARCHAR(10)</text>
    <use href="#nn" x="746" y="200"/>
    <text x="758" y="204" class="col">qtdSemestres INT</text>
    <rect x="731" y="214" width="228" height="30" fill="url(#idx)"/>
    <text x="742" y="234" class="idx">Indexes</text>
    <polygon points="942,223 950,229 942,235" fill="#666"/>
  </g>

  <!-- aluno (0..N) para turma (1) -->
  <polyline points="270,260 327,260 327,110 385,110" class="rel"/>
  <path d="M288,260 L271,251 M288,260 L271,260 M288,260 L271,269" class="end"/>
  <circle cx="295" cy="260" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M367,102 L367,118 M373,102 L373,118" class="end"/>

  <!-- turma (0..N) para curso (1) -->
  <polyline points="615,200 672,200 672,110 730,110" class="rel"/>
  <path d="M633,200 L616,191 M633,200 L616,200 M633,200 L616,209" class="end"/>
  <circle cx="640" cy="200" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M712,102 L712,118 M718,102 L718,118" class="end"/>
</svg>
