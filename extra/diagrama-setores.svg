<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3ee"/>
      <stop offset="1" stop-color="#8fb4dd"/>
    </linearGradient>
    <linearGradient id="idx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c9c9"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <!-- chave primária -->
    <g id="pk">
      <ellipse cx="0" cy="-3" rx="3.2" ry="3.6" fill="#f5c400" stroke="#9a7a00" stroke-width="0.8"/>
      <rect x="-1.1" y="0" width="2.2" height="7" fill="#f5c400" stroke="#9a7a00" stroke-width="0.6"/>
    </g>
    <!-- coluna comum (losango vazado) -->
    <polygon id="col" points="0,-5 5,0 0,5 -5,0" fill="#ffffff" stroke="#7fa6c9" stroke-width="1.2"/>
    <!-- coluna NOT NULL (losango azul preenchido) -->
    <polygon id="nn" points="0,-5 5,0 0,5 -5,0" fill="#4a86c8" stroke="#2f5f9a" stroke-width="0.8"/>
    <!-- chave estrangeira (losango vermelho) -->
    <polygon id="fk" points="0,-5 5,0 0,5 -5,0" fill="#e0574c" stroke="#a8322a" stroke-width="0.8"/>
    <!-- ícone de tabela -->
    <g id="tbl">
      <rect x="0" y="0" width="15" height="13" fill="#ffffff" stroke="#2f5f9a" stroke-width="1.2"/>
      <rect x="0" y="0" width="15" height="3.5" fill="#2f5f9a"/>
      <line x1="0" y1="8" x2="15" y2="8" stroke="#2f5f9a" stroke-width="0.9"/>
      <line x1="7.5" y1="3.5" x2="7.5" y2="13" stroke="#2f5f9a" stroke-width="0.9"/>
    </g>
  </defs>
  <style>
    text { font-family: Tahoma, "DejaVu Sans", Verdana, sans-serif; fill: #1a1a1a; }
    .tname { font-size: 15px; font-weight: bold; }
    .col { font-size: 12px; }
    .idx { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .rel { stroke: #555555; stroke-width: 1.6; fill: none; stroke-dasharray: 9 6; }
    .end { stroke: #555555; stroke-width: 1.4; fill: none; }
  </style>

  <!-- camada (layer) -->
  <rect x="0" y="0" width="760" height="640" fill="#ffffff"/>
  <rect x="2" y="2" width="756" height="636" fill="#f2f2fb" stroke="#c8c8dc" stroke-width="1"/>
  <path d="M2,2 H258 L268,26 H2 Z" fill="url(#tab)" stroke="#c0c0c0" stroke-width="1"/>
  <text x="10" y="19" font-size="12">Empresa e Estrutura de Setores</text>

  <g>
    <rect x="90" y="60" width="230" height="194" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M90,94 V66 a6,6 0 0 1 6,-6 H314 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="100" y="70"/>
    <text x="124" y="83" class="tname">setor</text>
    <polygon points="300,73 310,73 305,80" fill="#555"/>
    <rect x="91" y="94" width="228" height="120" fill="#ffffff"/>
    <use href="#pk" x="106" y="110"/>
    <text x="118" y="114" class="col">pkSetor INT</text>
    <use href="#nn" x="106" y="140"/>
    <text x="118" y="144" class="col">nmSetor VARCHAR(45)</text>
    <use href="#nn" x="106" y="170"/>
    <text x="118" y="174" class="col">sigla VARCHAR(10)</text>
    <use href="#fk" x="106" y="200"/>
    <text x="118" y="204" class="col">fkSetorSuperior INT</text>
    <rect x="91" y="214" width="228" height="30" fill="url(#idx)"/>
    <text x="102" y="234" class="idx">Indexes</text>
    <polygon points="302,223 310,229 302,235" fill="#666"/>
  </g>

  <g>
    <rect x="480" y="60" width="230" height="254" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M480,94 V66 a6,6 0 0 1 6,-6 H704 a6,6 0 0 1 6,6 V94 Z" fill="url(#head)"/>
    <use href="#tbl" x="490" y="70"/>
    <text x="514" y="83" class="tname">funcionario</text>
    <polygon points="690,73 700,73 695,80" fill="#555"/>
    <rect x="481" y="94" width="228" height="180" fill="#ffffff"/>
    <use href="#pk" x="496" y="110"/>
    <text x="508" y="114" class="col">pkFuncionario INT</text>
    <use href="#nn" x="496" y="140"/>
    <text x="508" y="144" class="col">nmFuncionario VARCHAR(45)</text>
    <use href="#nn" x="496" y="170"/>
    <text x="508" y="174" class="col">email VARCHAR(100)</text>
    <use href="#nn" x="496" y="200"/>
    <text x="508" y="204" class="col">salario DECIMAL(8,2)</text>
    <use href="#nn" x="496" y="230"/>
    <text x="508" y="234" class="col">dtAdmissao DATE</text>
    <use href="#fk" x="496" y="260"/>
    <text x="508" y="264" class="col">fkSetor INT</text>
    <rect x="481" y="274" width="228" height="30" fill="url(#idx)"/>
    <text x="492" y="294" class="idx">Indexes</text>
    <polygon points="692,283 700,289 692,295" fill="#666"/>
  </g>

  <g>
    <rect x="480" y="350" width="230" height="254" rx="6" fill="#a9c6e8" stroke="#8fa9c8"/>
    <path d="M480,384 V356 a6,6 0 0 1 6,-6 H704 a6,6 0 0 1 6,6 V384 Z" fill="url(#head)"/>
    <use href="#tbl" x="490" y="360"/>
    <text x="514" y="373" class="tname">projeto</text>
    <polygon points="690,363 700,363 695,370" fill="#555"/>
    <rect x="481" y="384" width="228" height="180" fill="#ffffff"/>
    <use href="#pk" x="496" y="400"/>
    <text x="508" y="404" class="col">pkProjeto INT</text>
    <use href="#nn" x="496" y="430"/>
    <text x="508" y="434" class="col">nmProjeto VARCHAR(45)</text>
    <use href="#col" x="496" y="460"/>
    <text x="508" y="464" class="col">descricao VARCHAR(200)</text>
    <use href="#nn" x="496" y="490"/>
    <text x="508" y="494" class="col">dtInicio DATE</text>
    <use href="#col" x="496" y="520"/>
    <text x="508" y="524" class="col">dtPrevisaoTermino DATE</text>
    <use href="#fk" x="496" y="550"/>
    <text x="508" y="554" class="col">fkSetor INT</text>
    <rect x="481" y="564" width="228" height="30" fill="url(#idx)"/>
    <text x="492" y="584" class="idx">Indexes</text>
    <polygon points="692,573 700,579 692,585" fill="#666"/>
  </g>

  <!-- funcionario (0..N) para setor (1) -->
  <polyline points="320,140 425,140 425,260 480,260" class="rel"/>
  <path d="M462,260 L479,251 M462,260 L479,260 M462,260 L479,269" class="end"/>
  <circle cx="455" cy="260" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M332,132 L332,148 M338,132 L338,148" class="end"/>

  <!-- projeto (0..N) para setor (1) -->
  <polyline points="320,170 395,170 395,550 480,550" class="rel"/>
  <path d="M462,550 L479,541 M462,550 L479,550 M462,550 L479,559" class="end"/>
  <circle cx="455" cy="550" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M332,162 L332,178 M338,162 L338,178" class="end"/>

  <!-- autorrelacionamento: setor superior (0..1) para setores subordinados (0..N) -->
  <polyline points="90,200 34,200 34,110 90,110" class="rel"/>
  <path d="M72,200 L89,191 M72,200 L89,200 M72,200 L89,209" class="end"/>
  <circle cx="65" cy="200" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
  <path d="M76,102 L76,118" class="end"/>
  <circle cx="64" cy="110" r="4.5" fill="#f2f2fb" stroke="#555555" stroke-width="1.4"/>
</svg>
