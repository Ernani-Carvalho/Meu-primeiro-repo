<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo descricao" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, 'Liberation Sans', sans-serif">
  <title id="titulo">DataBus — Arquitetura técnica</title>
  <desc id="descricao">Arquitetura do DataBus em quatro camadas. No ônibus, sensores ultrassônicos sobre as portas de entrada e de saída enviam leituras ao Arduino UNO (1), que detecta a passagem e repassa o evento por serial ao módulo Wi-Fi ESP8266 (2). O módulo envia o evento em JSON à API Node.js por HTTP/REST (3), que o grava no MySQL de uma máquina virtual Lubuntu Server no VirtualBox (4). Para a dashboard, a API lê no banco os totais de entradas e saídas e a capacidade (5) e envia a lotação em JSON ao site em HTML, CSS e JavaScript a cada 5 segundos (6), que a exibe ao usuário da empresa de transporte (7). Lotação atual = entradas menos saídas, comparada à capacidade máxima do ônibus.</desc>
